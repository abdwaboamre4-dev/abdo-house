<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | ABDO HOUSE</title>
  <link rel="icon" type="image/jpeg" href="assets/images/abdo-house-logo.jpg">
  <link rel="stylesheet" href="css/luxury-core.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-primary, #0B0B0D);
      color: var(--text-primary, #F2EFE8);
      font-family: var(--font-sans, sans-serif);
      text-align: center;
      padding: 2rem;
    }
    .error-container {
      max-width: 580px;
    }
    .error-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 2rem;
    }
    .error-num {
      font-family: var(--font-serif, serif);
      font-size: 6rem;
      color: var(--accent-gold, #C9B27C);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-family: var(--font-serif, serif);
      font-size: 2rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .error-desc {
      color: var(--text-secondary, #9A9893);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>
  <div class="error-container">
    <img src="assets/images/abdo-house-logo.jpg" alt="ABDO HOUSE" class="error-logo">
    <div class="error-num">404</div>
    <h1 class="error-title">PAGE NOT FOUND</h1>
    <p class="error-desc">
      The requested page does not exist or has been relocated. Return to the main agency portal to explore our creative and social media services.
    </p>
    <a href="index.html" class="btn btn-primary">
      <span>RETURN TO ABDO HOUSE &rarr;</span>
    </a>
  </div>
</body>
</html>
